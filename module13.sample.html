<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Module 13 — Production Simulation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link

    <style>
        :root {
            --bg-base: #0d0d0f;
            --bg-surface: #131316;
            --bg-el: #1a1a1f;
            --bg-hover: #1f1f26;
            --bg-active: #23232c;
            --border: #27272f;
            --border-l: #1e1e26;
            --text: #e8e8ec;
            --text-sec: #7a7a8a;
            --text-mut: #4a4a58;
            --accent: #4f6ef7;
            --accent-dim: #4f6ef71a;
            --green: #34d399;
            --green-dim: #34d3991a;
            --amber: #fbbf24;
            --amber-dim: #fbbf241a;
            --red: #f87171;
            --red-dim: #f871711a;
            --sans: 'DM Sans', sans-serif;
            --mono: 'DM Mono', monospace;

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0

        html,
        body {
            min-height: 100%;
            background: var(--bg-base);
            color: var(--text);
            font-family: var(--sans);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased

        a {
            color: inherit;
            text-decoration: none
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none
        }

        input,
        select {
            font-family: inherit
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px
        }

        ::selection {
            background: var(--accent-dim);
            color: var(--accent)
        }

        /* shell */

            display: flex;
            height: 100vh;
            overflow: hidden

        #sidebar {
            width: 220px;
            height: 100vh;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);

        #main {

        #header {

            display: flex;
            align-items: center;
            padding: 0 24px;
            background: var(--bg-surface);
            flex-shrink: 0;
            gap: 8px

        #page {

            overflow-y: auto;

        /* sidebar */
        .logo {

            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 10px;
            border-bottom: 1px solid var(--border)

        .logo-m {

            height: 28px;

        .logo-v {

            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;

        .nav-i {

            gap: 9px;
            background: transparent;
            color: var(--text-sec);
            border-left: 2px solid transparent;

        .nav-i.active {

        .card {

        .card-hd {

        .card-body {

        /* tables */
        .tbl-wrap {

        table {
            width: 100%;

        td {

        /* bars */

            align-items: center;

            font-size: 10px;
            font-weight: 700;
            letter-spacing: .1em;

            background: var(--border)

        .sec-sep-l {

        .alert {
            border-radius: 8px;

            display: flex;

        .alert-danger {

            border: 1px solid var(--red)

        .alert-icon {
            font-size: 16px;
            flex-shrink: 0

        .add-row-btn {
            width: 100%;
            border: 1px dashed var(--border);
            border-radius: 6px;
            padding: 7px;
            font-size: 12px;
            color: var(--text-sec);

            margin-top: 4px;

            font-family: var(--sans)
        }

        .add-row-btn:hover {
            border-color: var(--accent);
            color: var(--accent)

        /* Advanced toggle */
        .adv-toggle {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-sec);
            padding: 0;
            display: flex;
            align-items: center;
            gap: 4px;

        }

        .adv-panel {
            padding: 12px;
            background: var(--bg-el);
            border-radius: 6px;
            border: 1px solid var(--border)
        }

        /* detail row */
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
            border-bottom: 1px solid var(--border-l)
        }

        .detail-row:last-child {
            border-bottom: none
        }

        /* highlight box */
        .highlight-box {
            padding: 12px 14px;
            background: var(--bg-el);
            border-radius: 6px;
            border: 1px solid var(--border)
        }

        /* pre-run placeholder */
        .prerun {

            flex-direction: column;

        }

        .prerun-icon {

<body>

        <!-- SIDEBAR -->

        <!-- MAIN -->

                <span style="font-size:12px;color:var(--text-mut)">Intelligence</span>

                <div style="margin-left:auto;font-size:11.5px;color:var(--text-mut);font-family:var(--mono);background:var(--bg-el);border:1px solid var(--border);border-radius:5px;padding:5px 10px"

    <script>
        // ── data ─────────────────────────────────────────────────
        const DUMMY = {
            products: [
                { product_id: "ALTO", name: "Alto" },
                { product_id: "SWIFT", name: "Swift" },
                { product_id: "BALENO", name: "Baleno" },
            ],
            bom: [
                { pid: "ALTO", mid: "STEEL_KG", qpu: 480 }, { pid: "ALTO", mid: "RUBBER_KG", qpu: 52 },
                { pid: "ALTO", mid: "GLASS_SQM", qpu: 12 }, { pid: "ALTO", mid: "PLASTIC_KG", qpu: 38 },
                { pid: "ALTO", mid: "ALUMINUM_KG", qpu: 45 }, { pid: "ALTO", mid: "ELECTRONICS_SET", qpu: 1 },
                { pid: "ALTO", mid: "FABRIC_M", qpu: 18 },
                { pid: "SWIFT", mid: "STEEL_KG", qpu: 620 }, { pid: "SWIFT", mid: "RUBBER_KG", qpu: 64 },
                { pid: "SWIFT", mid: "GLASS_SQM", qpu: 14 }, { pid: "SWIFT", mid: "PLASTIC_KG", qpu: 45 },
                { pid: "SWIFT", mid: "ALUMINUM_KG", qpu: 60 }, { pid: "SWIFT", mid: "ELECTRONICS_SET", qpu: 1 },
                { pid: "SWIFT", mid: "FABRIC_M", qpu: 22 },
                { pid: "BALENO", mid: "STEEL_KG", qpu: 710 }, { pid: "BALENO", mid: "RUBBER_KG", qpu: 70 },
                { pid: "BALENO", mid: "GLASS_SQM", qpu: 16 }, { pid: "BALENO", mid: "PLASTIC_KG", qpu: 52 },
                { pid: "BALENO", mid: "ALUMINUM_KG", qpu: 75 }, { pid: "BALENO", mid: "ELECTRONICS_SET", qpu: 1 },
                { pid: "BALENO", mid: "FABRIC_M", qpu: 24 },
            ],
            routing: [
                { pid: "ALTO", op: "Body Shop", lm: 280, mm: 190, mach: "PRESS_01" },
                { pid: "ALTO", op: "Paint Shop", lm: 140, mm: 210, mach: "PAINT_01" },
                { pid: "ALTO", op: "Assembly", lm: 220, mm: 120, mach: "ASSY_01" },
                { pid: "ALTO", op: "Quality", lm: 60, mm: 30, mach: "QC_01" },
                { pid: "SWIFT", op: "Body Shop", lm: 350, mm: 230, mach: "PRESS_01" },
                { pid: "SWIFT", op: "Paint Shop", lm: 170, mm: 250, mach: "PAINT_01" },
                { pid: "SWIFT", op: "Assembly", lm: 260, mm: 140, mach: "ASSY_01" },
                { pid: "SWIFT", op: "Quality", lm: 80, mm: 40, mach: "QC_01" },
                { pid: "BALENO", op: "Body Shop", lm: 390, mm: 260, mach: "PRESS_01" },
                { pid: "BALENO", op: "Paint Shop", lm: 180, mm: 290, mach: "PAINT_01" },
                { pid: "BALENO", op: "Assembly", lm: 280, mm: 160, mach: "ASSY_01" },
                { pid: "BALENO", op: "Quality", lm: 80, mm: 50, mach: "QC_01" },
            ],
            materials: [
                { mid: "STEEL_KG", name: "Steel", unit: "kg", stock: 43000, price: 72 },
                { mid: "RUBBER_KG", name: "Rubber", unit: "kg", stock: 5000, price: 120 },
                { mid: "GLASS_SQM", name: "Glass", unit: "sqm", stock: 900, price: 650 },
                { mid: "PLASTIC_KG", name: "Plastic", unit: "kg", stock: 3200, price: 95 },
                { mid: "ALUMINUM_KG", name: "Aluminum", unit: "kg", stock: 5000, price: 220 },
                { mid: "ELECTRONICS_SET", name: "Electronics", unit: "set", stock: 90, price: 18000 },
                { mid: "FABRIC_M", name: "Fabric", unit: "m", stock: 1400, price: 180 },
            ],
            machines: [
                { mid: "PRESS_01", name: "Press Line", kw: 85 },
                { mid: "PAINT_01", name: "Paint Booth", kw: 120 },
                { mid: "ASSY_01", name: "Assembly Conveyor", kw: 65 },
                { mid: "QC_01", name: "Quality Bench", kw: 25 },
            ],
            laborRate: 550, energyRate: 9, defaultShift: 10,
        };

        // ── engine (mirrors engine.py) ────────────────────────────
        function explodeBOM(mps) {
            const req = {};
            for (const [pid, qty] of Object.entries(mps)) {
                DUMMY.bom.filter(b => b.pid === pid).forEach(b => {
                    req[b.mid] = (req[b.mid] || 0) + qty * b.qpu;
                });
            }
            return req;
        }
        function explodeRouting(mps) {
            let lh = 0, mh = 0; const mhm = {};
            for (const [pid, qty] of Object.entries(mps)) {
                DUMMY.routing.filter(r => r.pid === pid).forEach(r => {
                    lh += qty * r.lm / 60; mh += qty * r.mm / 60;
                    mhm[r.mach] = (mhm[r.mach] || 0) + qty * r.mm / 60;
                });
            }
            return { lh, mh, mhm };
        }
        function calcMRP(req) {
            const matMap = {}; DUMMY.materials.forEach(m => matMap[m.mid] = m);
            const lines = [];
            for (const [mid, rq] of Object.entries(req)) {
                const m = matMap[mid]; if (!m) continue;
                const short = Math.max(0, rq - m.stock);
                lines.push({
                    mid, name: m.name, unit: m.unit, req: rq, avail: m.stock, short, price: m.price,
                    cost: rq * m.price, ready: short <= 0
                });
            }
            const readyN = lines.filter(l => l.ready).length;
            return {
                lines, totalCost: lines.reduce((s, l) => s + l.cost, 0),
                readinessPct: lines.length ? (100 * readyN / lines.length) : 100, readyN
            };
        }
        function calcCRP(routing, workers, shift, startDate) {
            const daily = workers * shift; const req = routing.lh;
            const days = req > 0 ? req / daily : 0; const full = Math.ceil(days);
            const comp = new Date(startDate); comp.setDate(comp.getDate() + full - 1);
            const y = startDate.getFullYear(), mo = startDate.getMonth();
            const lastD = new Date(y, mo + 1, 0).getDate();
            const monthEnd = new Date(y, mo, lastD);
            const remDays = Math.floor((monthEnd - startDate) / 86400000) + 1;
            const monthAvail = remDays * daily;
            return { req, days, full, comp, monthEnd, monthAvail, overload: req > monthAvail };
        }
        function calcCost(mrp, routing, workers, shift, laborRate, energyRate) {
            const lc = routing.lh * laborRate;
            let kwh = 0;
            const machMap = {}; DUMMY.machines.forEach(m => machMap[m.mid] = m);
            for (const [mid, mh] of Object.entries(routing.mhm)) {

            }
            const ec = kwh * energyRate; const mc = mrp.totalCost;
            return { lc, ec, mc, total: lc + ec + mc, kwh };
        }

        // ── SVG helpers ───────────────────────────────────────────
        function svgRing(pct, color) {
            const r = 48, cx = 60, cy = 60, circ = 2 * Math.PI * r;
            const dash = (pct / 100) * circ;
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("width", "120"); svg.setAttribute("height", "120");
            const track = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            track.setAttribute("cx", cx); track.setAttribute("cy", cy); track.setAttribute("r", r);
            track.setAttribute("fill", "none"); track.setAttribute("stroke", "var(--bg-active)");
            track.setAttribute("stroke-width", "8");
            const fill = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            fill.setAttribute("cx", cx); fill.setAttribute("cy", cy); fill.setAttribute("r", r);
            fill.setAttribute("fill", "none"); fill.setAttribute("stroke", color);
            fill.setAttribute("stroke-width", "8"); fill.setAttribute("stroke-linecap", "round");
            fill.setAttribute("stroke-dasharray", `${dash} ${circ - dash}`);
            fill.setAttribute("stroke-dashoffset", `${circ * 0.25}`);
            fill.style.transition = "stroke-dasharray .6s ease";
            const t1 = document.createElementNS("http://www.w3.org/2000/svg", "text");
            t1.setAttribute("x", cx); t1.setAttribute("y", cy - 4); t1.setAttribute("text-anchor", "middle");
            t1.setAttribute("fill", "var(--text)"); t1.setAttribute("font-size", "18");
            t1.setAttribute("font-weight", "700"); t1.setAttribute("font-family", "DM Mono,monospace");
            t1.textContent = `${Math.round(pct)}%`;
            const t2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
            t2.setAttribute("x", cx); t2.setAttribute("y", cy + 14); t2.setAttribute("text-anchor", "middle");
            t2.setAttribute("fill", "var(--text-mut)"); t2.setAttribute("font-size", "10");
            t2.textContent = "READY";
            svg.appendChild(track); svg.appendChild(fill); svg.appendChild(t1); svg.appendChild(t2);
            return svg;
        }

        function svgGauge(pct, color) {
            const r = 60, cx = 80, cy = 78;
            const circ = 2 * Math.PI * r; const half = circ / 2;
            const fill = Math.min(1, pct / 100);
            const toRad = deg => deg * Math.PI / 180;
            const angle = fill * 180;
            const endX = cx + r * Math.cos(toRad(180 - angle));
            const endY = cy - r * Math.sin(toRad(180 - angle));
            const largeArc = angle > 180 ? 1 : 0;

            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("width", "160"); svg.setAttribute("height", "96");

            const mkPath = (stroke, sw, d) => {
                const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
                p.setAttribute("d", d); p.setAttribute("fill", "none");
                p.setAttribute("stroke", stroke); p.setAttribute("stroke-width", sw);
                p.setAttribute("stroke-linecap", "round"); return p;
            };
            svg.appendChild(mkPath("var(--bg-active)", 10, `M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`));
            if (pct > 0) {
                const p = mkPath(color, 10, `M ${cx - r} ${cy} A ${r} ${r} 0 ${largeArc} 1 ${endX} ${endY}`);
                p.style.transition = "d .7s ease"; svg.appendChild(p);
            }
            const mkT = (x, y, size, col, content) => {
                const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
                t.setAttribute("x", x); t.setAttribute("y", y); t.setAttribute("text-anchor", "middle");
                t.setAttribute("fill", col); t.setAttribute("font-size", size);
                t.setAttribute("font-family", "DM Mono,monospace"); t.textContent = content; return t;
            };
            svg.appendChild(mkT(cx - r - 4, cy + 18, 9, "var(--text-mut)", "0"));
            svg.appendChild(mkT(cx + r + 4, cy + 18, 9, "var(--text-mut)", "100%"));
            svg.appendChild(mkT(cx, cy - 10, 18, color, `${Math.round(pct)}%`));
            svg.appendChild(mkT(cx, cy + 8, 9, "var(--text-mut)", "LOAD"));
            return svg;
        }

        function svgDonut(slices) {
            const total = slices.reduce((s, sl) => s + sl.v, 0); if (!total) return el("div", {}, "No data");
            const r = 52, cx = 64, cy = 64; const circ = 2 * Math.PI * r;
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("width", "128"); svg.setAttribute("height", "128");
            const bg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            bg.setAttribute("cx", cx); bg.setAttribute("cy", cy); bg.setAttribute("r", r);
            bg.setAttribute("fill", "none"); bg.setAttribute("stroke", "var(--bg-active)");
            bg.setAttribute("stroke-width", "14"); svg.appendChild(bg);
            let cum = 0;
            slices.forEach(sl => {
                const pct = sl.v / total;
                const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", r);
                c.setAttribute("fill", "none"); c.setAttribute("stroke", sl.color);
                c.setAttribute("stroke-width", "14"); c.setAttribute("stroke-linecap", "butt");
                c.setAttribute("stroke-dasharray", `${circ * pct} ${circ * (1 - pct)}`);
                c.setAttribute("stroke-dashoffset", `${circ * (0.25 - cum)}`);
                c.style.transition = "stroke-dasharray .5s ease";
                svg.appendChild(c); cum += pct;
            });
            return svg;
        }

        // ── run simulation ────────────────────────────────────────
        function runSim() {
            const mps = {};
            state.mps.forEach(r => { if (r.pid && Number(r.qty) > 0) mps[r.pid] = Number(r.qty); });
            if (!Object.keys(mps).length) { alert("Add at least one product with qty > 0"); return; }
            const startDate = new Date(state.start);
            const req = explodeBOM(mps);
            const routing = explodeRouting(mps);
            const mrp = calcMRP(req);
            const crp = calcCRP(routing, Number(state.workers), Number(state.shift), startDate);
            const cost = calcCost(mrp, routing, Number(state.workers), Number(state.shift), Number(state.laborRate), Number(state.energyRate));
            setState({ result: { mrp, crp, routing, cost, mps }, activeTab: "MRP" });
            setTimeout(() => document.getElementById("results-anchor")?.scrollIntoView({ behavior: "smooth", block: "start" }), 50);
        }

            top.appendChild(card("Hours Breakdown", hoursBody));

            // Timeline
            const timeBody = el("div", { style: "display:flex;flex-direction:column" });
            [
                ["Days Required", `${Math.ceil(r.crp.days)} days`],
                ["Start Date", fmtDt(new Date(state.start))],
                ["Est. Completion", fmtDt(r.crp.comp)],
                ["Month End", fmtDt(r.crp.monthEnd)],
                ["Workers × Shift", `${state.workers} × ${state.shift}h`],
                ["Daily Capacity", `${fmtN(state.workers * state.shift)} hrs/day`],
            ].forEach(([lbl, val]) => {
                const row = el("div", { class: "detail-row" });
                app(row, el("span", { style: "font-size:12px;color:var(--text-sec)" }, lbl),
                    el("span", { style: "font-size:13px;font-family:var(--mono)" }, val));
                timeBody.appendChild(row);
            });
            top.appendChild(card("Timeline", timeBody));
            wrap.appendChild(top);

            // Machine load bars
            const machBody = el("div", { style: "display:grid;grid-template-columns:1fr 1fr;gap:24px" });
            const COLS = ["var(--accent)", "var(--green)", "var(--amber)", "var(--red)"];
            const machMap = {}; DUMMY.machines.forEach(m => machMap[m.mid] = m);
            const lBars = el("div", {}); const rBars = el("div", {});
            Object.entries(r.routing.mhm).forEach(([mid, mh], i) => {
                const m = machMap[mid];
                lBars.appendChild(hBar(m ? m.name : mid, mh, Math.max(...Object.values(r.routing.mhm)), COLS[i % 4], `${fmtN(mh)} hrs`));
                rBars.appendChild(hBar(m ? m.name : mid, mh, r.crp.monthAvail, COLS[i % 4], `${fmtN(mh)}h / ${fmtN(r.crp.monthAvail)}h avail`));
            });
            const lW = el("div", {}); const rW = el("div", {});
            app(lW, el("div", { style: "font-size:12px;color:var(--text-sec);margin-bottom:10px" }, "Station hours (absolute)"), lBars);
            app(rW, el("div", { style: "font-size:12px;color:var(--text-sec);margin-bottom:10px" }, "Utilisation vs monthly capacity"), rBars);
            app(machBody, lW, rW);
            wrap.appendChild(card("Machine Hours by Station", machBody));
            return wrap;
        }

        function renderCostingTab(r) {
            const wrap = el("div", { style: "display:grid;grid-template-columns:1fr 1fr;gap:12px" });

            // Donut
            const slices = [
                { label: "Material", v: r.cost.mc, color: "var(--accent)", formatted: fmtL(r.cost.mc) },
                { label: "Labor", v: r.cost.lc, color: "var(--green)", formatted: fmtL(r.cost.lc) },
                { label: "Electricity", v: r.cost.ec, color: "var(--amber)", formatted: fmtL(r.cost.ec) },
            ];
            const donutBody = el("div", { style: "display:flex;align-items:center;gap:20px" });
            donutBody.appendChild(svgDonut(slices));
            const legend = el("div", { style: "display:flex;flex-direction:column;gap:8px;flex:1" });
            slices.forEach(sl => {
                const pct = ((sl.v / r.cost.total) * 100).toFixed(1);
                const row = el("div", { style: "display:flex;align-items:center;gap:8px" });
                app(row,
                    el("span", { style: `width:8px;height:8px;border-radius:50%;background:${sl.color};flex-shrink:0` }),
                    el("span", { style: "flex:1;font-size:12px;color:var(--text-sec)" }, sl.label),
                    el("span", { style: "font-size:12px;font-family:var(--mono)" }, sl.formatted),
                    el("span", { style: "font-size:11px;color:var(--text-mut);width:38px;text-align:right" }, `${pct}%`)
                );
                legend.appendChild(row);
            });
            donutBody.appendChild(legend);
            wrap.appendChild(card("Cost Breakdown", donutBody));

            // Detail
            const detailBody = el("div", { style: "display:flex;flex-direction:column;gap:8px" });
            [
                { label: "Material Cost", val: r.cost.mc, color: "var(--accent)", note: "BOM × Latest Purchase Price" },
                { label: "Labor Cost", val: r.cost.lc, color: "var(--green)", note: `${fmtN(r.routing.lh)} hrs × ₹${state.laborRate}/hr` },
                { label: "Electricity Cost", val: r.cost.ec, color: "var(--amber)", note: `${fmtN(r.cost.kwh)} kWh × ₹${state.energyRate}` },
            ].forEach(row => {
                const box = el("div", { style: `padding:12px 14px;background:var(--bg-el);border-radius:6px;border:1px solid var(--border);border-left:3px solid ${row.color}` });
                const top = el("div", { style: "display:flex;justify-content:space-between;margin-bottom:3px" });
                app(top, el("span", { style: "font-size:13px;font-weight:500" }, row.label),
                    el("span", { style: "font-family:var(--mono);font-size:14px;font-weight:600" }, fmtL(row.val)));
                app(box, top, el("div", { style: "font-size:11px;color:var(--text-mut)" }, row.note));
                detailBody.appendChild(box);
            });
            // Total
            const tot = el("div", { style: "padding:12px 14px;background:var(--accent-dim);border-radius:6px;border:1px solid var(--accent)" });
            const totTop = el("div", { style: "display:flex;justify-content:space-between" });
            app(totTop, el("span", { style: "font-size:13px;font-weight:600" }, "Total Estimated Cost"),
                el("span", { style: `font-family:var(--mono);font-size:18px;font-weight:700;color:var(--accent)` }, fmtL(r.cost.total)));
            app(tot, totTop, el("div", { style: "font-size:11px;color:var(--text-mut);margin-top:3px" }, `${fmtCur(r.cost.total)} · Provisional — actual may vary`));
            detailBody.appendChild(tot);
            wrap.appendChild(card("Cost Detail", detailBody));

            // Per-unit breakdown
            const puWrap = el("div", { style: "grid-column:span 2" });
            const puTbl = el("table", {});
            puTbl.innerHTML = '<thead><tr><th>Product</th><th class="r">Qty</th><th class="r">Labor hrs/unit</th><th class="r">Material Cost/unit</th><th class="r">Est. Cost/unit</th></tr></thead>';
            const puTbody = el("tbody", {});
            state.mps.filter(r => r.pid && r.qty > 0).forEach(row => {
                const prod = DUMMY.products.find(p => p.product_id === row.pid);
                const steps = DUMMY.routing.filter(r => r.pid === row.pid);
                const lm = steps.reduce((s, r) => s + r.lm, 0) / 60;
                const mc = DUMMY.bom.filter(b => b.pid === row.pid).reduce((s, b) => {
                    const m = DUMMY.materials.find(m => m.mid === b.mid); return s + (m ? b.qpu * m.price : 0);
                }, 0);
                const tot = lm * Number(state.laborRate) + mc;
                const tr = el("tr", {},
                    `<td style="font-weight:500">${prod?.name || row.pid}</td>
       <td class="r mono">${row.qty}</td>
       <td class="r mono" style="color:var(--text-sec)">${fmtN(lm)} hrs</td>
       <td class="r mono">${fmtL(mc)}</td>
       <td class="r mono" style="font-weight:600">${fmtL(tot)}</td>`);
                puTbody.appendChild(tr);
            });
            puTbl.appendChild(puTbody);
            const puWrapInner = el("div", { class: "tbl-wrap" });
            puWrapInner.appendChild(puTbl);
            puWrap.appendChild(card("Per-Unit Cost by Product", puWrapInner, null, true));
            wrap.appendChild(puWrap);
            return wrap;
        }

        function renderRoutingTab(r) {
            const wrap = el("div", { style: "display:flex;flex-direction:column;gap:12px" });
            const COLS = ["var(--accent)", "var(--green)", "var(--amber)"];
            const top = el("div", { style: "display:grid;grid-template-columns:repeat(3,1fr);gap:12px" });
            [
                ["Total Man-Hours", fmtN(r.routing.lh), COLS[0]],
                ["Total Machine-Hours", fmtN(r.routing.mh), COLS[1]],
                ["Energy Consumed", `${fmtN(r.cost.kwh)} kWh`, COLS[2]],
            ].forEach(([lbl, val, col]) => {
                const c = el("div", { style: `background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;border-top:2px solid ${col}` });
                app(c, el("div", { style: "font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mut);margin-bottom:8px" }, lbl),
                    el("div", { style: "font-size:22px;font-weight:600;font-family:var(--mono)" }, val));
                top.appendChild(c);
            });
            wrap.appendChild(top);

            // Routing table
            const tbl = el("table", {});
            tbl.innerHTML = '<thead><tr><th>Product</th><th>Operation</th><th>Machine</th><th class="r">Labor Min/unit</th><th class="r">Machine Min/unit</th><th class="r">Total Labor Hrs</th><th class="r">Total Machine Hrs</th></tr></thead>';
            const tbody = el("tbody", {});
            const machMap = {}; DUMMY.machines.forEach(m => machMap[m.mid] = m);
            state.mps.filter(r => r.pid && r.qty > 0).forEach(row => {
                const prod = DUMMY.products.find(p => p.product_id === row.pid);
                const steps = DUMMY.routing.filter(r => r.pid === row.pid);
                steps.forEach((step, si) => {
                    const mach = machMap[step.mach];
                    const tr = el("tr", {});
                    tr.innerHTML = `
        <td style="font-weight:${si === 0 ? 500 : 400};color:${si === 0 ? "var(--text)" : "var(--text-mut)"}">${si === 0 ? prod?.name || row.pid : ""}</td>
        <td>${step.op}</td>
        <td style="color:var(--text-sec);font-size:12px">${mach?.name || step.mach}</td>
        <td class="r mono">${step.lm}</td>
        <td class="r mono">${step.mm}</td>
        <td class="r mono" style="color:var(--accent)">${fmtN(row.qty * step.lm / 60)}</td>
        <td class="r mono" style="color:var(--green)">${fmtN(row.qty * step.mm / 60)}</td>
      `;
                    tbody.appendChild(tr);
                });
            });
            tbl.appendChild(tbody);
            const tw = el("div", { class: "tbl-wrap" }); tw.appendChild(tbl);
            wrap.appendChild(card("Operation Breakdown by Product", tw, null, true));
            return wrap;
        }

        // ── main render ───────────────────────────────────────────
        function render() {
            const page = document.getElementById("page");
            page.innerHTML = "";
            const frag = document.createDocumentFragment();

            // Header
            const hdr = el("div", { class: "page-hdr" });
            const left = el("div", {});
            app(left, el("div", { class: "page-title" }, "Production Simulation & Forecasting"),
                el("div", { class: "page-desc" }, "MPS → BOM Explosion → Capacity Planning → Cost Estimation"));
            hdr.appendChild(left);
            if (state.result) {
                const resetBtn = el("button", { class: "btn btn-secondary btn-sm", onclick: () => setState({ result: null }) });
                resetBtn.textContent = "↺  Reset";
                hdr.appendChild(resetBtn);
            }
            frag.appendChild(hdr);

            // Two-col layout: input | reference
            const layout = el("div", { style: "display:grid;grid-template-columns:360px 1fr;gap:16px;margin-bottom:24px" });
            layout.appendChild(renderInputPanel());
            layout.appendChild(renderRightPanel());
            frag.appendChild(layout);

            // Results
            if (state.result) {
                const r = state.result;
                frag.appendChild(el("div", { id: "results-anchor" }));
                frag.appendChild(sectionSep("Simulation Results"));

                // Summary
                const sumGrid = el("div", { style: "display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px" });
                app(sumGrid,
                    sumCard("Total Estimated Cost", fmtL(r.cost.total), "Labor + Material + Overhead", "var(--accent)"),
                    sumCard("Days Required", `${Math.ceil(r.crp.days)} days`, `Completion: ${fmtDt(r.crp.comp)}`, r.crp.overload ? "var(--red)" : "var(--green)"),
                    sumCard("Material Readiness", fmtPct(r.mrp.readinessPct), `${r.mrp.readyN} / ${r.mrp.lines.length} materials OK`, r.mrp.readinessPct === 100 ? "var(--green)" : "var(--amber)"),
                    sumCard("Total Man-Hours", fmtN(r.routing.lh), `${fmtN(r.routing.mh)} machine-hrs`, "var(--text-mut)"),
                    sumCard("Capacity Status", r.crp.overload ? "OVERLOAD" : "OK", r.crp.overload ? "Exceeds monthly capacity" : "Within monthly capacity", r.crp.overload ? "var(--red)" : "var(--green)")
                );
                frag.appendChild(sumGrid);

                // Overload alert
                if (r.crp.overload) {
                    const alert = el("div", { class: "alert alert-danger", style: "margin-bottom:16px" });
                    const icon = el("div", { class: "alert-icon" }, "⚠");
                    const txt = el("div", {});
                    app(txt,
                        el("div", { style: "font-size:13px;font-weight:600;color:var(--red)" }, "Capacity Overload Detected"),
                        el("div", { style: "font-size:12px;color:var(--red);opacity:.85;margin-top:3px" },
                            `Required ${fmtN(r.crp.req)} man-hours exceeds monthly available ${fmtN(r.crp.monthAvail)} hours. Consider adding workers or extending shift hours.`)
                    );
                    app(alert, icon, txt);
                    frag.appendChild(alert);
                }

                // Tabs
                const TABS = ["MRP", "CRP", "Costing", "Routing"];
                const tabRow = el("div", { class: "tabs" });
                TABS.forEach(t => {
                    const tb = el("button", { class: `tab${state.activeTab === t ? " active" : ""}`, onclick: () => setState({ activeTab: t }) }, t);
                    tabRow.appendChild(tb);
                });
                frag.appendChild(tabRow);

                const tabContent = el("div", {});
                if (state.activeTab === "MRP") tabContent.appendChild(renderMRPTab(r));
                else if (state.activeTab === "CRP") tabContent.appendChild(renderCRPTab(r));
                else if (state.activeTab === "Costing") tabContent.appendChild(renderCostingTab(r));
                else if (state.activeTab === "Routing") tabContent.appendChild(renderRoutingTab(r));
                frag.appendChild(tabContent);
            }

            page.appendChild(frag);
        }

        // init
        document.getElementById("hdr-date").textContent =
            new Date().toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
        render();
    </script>
</body>

</html>
