<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechMicra ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg-base: #0d0d0f;
            --bg-surface: #131316;
            --bg-elevated: #1a1a1f;
            --bg-hover: #1f1f26;
            --bg-active: #23232c;
            --border: #27272f;
            --border-light: #1e1e26;
            --text-primary: #e8e8ec;
            --text-secondary: #7a7a8a;
            --text-muted: #4a4a58;
            --accent: #4f6ef7;
            --accent-dim: #4f6ef71a;
            --green: #34d399;
            --green-dim: #34d3991a;
            --amber: #fbbf24;
            --amber-dim: #fbbf241a;
            --red: #f87171;
            --red-dim: #f871711a;
            --r-sm: 6px;
            --r-md: 10px;
            --sidebar: 240px;
            --hdr: 56px;
            --sans: 'DM Sans', sans-serif;
            --mono: 'DM Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            height: 100%;
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--sans);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased
        }

        a {
            color: inherit;
            text-decoration: none
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none
        }

        input,
        select {
            font-family: inherit
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px
        }

        /* Layout */
        #app {
            display: flex;
            height: 100vh
        }

        #sidebar {
            width: var(--sidebar);
            height: 100vh;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            overflow: hidden
        }

        #main {
            margin-left: var(--sidebar);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden
        }

        #header {
            height: var(--hdr);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
            background: var(--bg-surface);
            position: sticky;
            top: 0;
            z-index: 10;
            flex-shrink: 0
        }

        #content {
            flex: 1;
            overflow-y: auto;
            padding: 24px
        }

        /* Sidebar */
        .logo {
            height: var(--hdr);
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.5px;
            flex-shrink: 0
        }

        .logo-name {
            font-weight: 600;
            font-size: 13px;
            letter-spacing: -0.3px
        }

        .logo-ver {
            font-size: 10px;
            color: var(--text-muted);
            font-family: var(--mono)
        }

        nav {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0
        }

        .nav-group-label {
            padding: 8px 18px 4px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted)
        }

        .nav-item {
            width: 100%;
            display: flex;
            align-items: center;
            padding: 7px 18px;
            gap: 9px;
            background: transparent;
            color: var(--text-secondary);
            border-left: 2px solid transparent;
            font-size: 13px;
            text-align: left;
            transition: all 0.1s
        }

        .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary)
        }

        .nav-item.active {
            background: var(--bg-active);
            color: var(--text-primary);
            border-left-color: var(--accent);
            font-weight: 500
        }

        .nav-icon {
            font-size: 14px;
            opacity: 0.8;
            width: 16px;
            flex-shrink: 0
        }

        .nav-chevron {
            font-size: 10px;
            color: var(--text-muted);
            margin-left: auto;
            transition: transform 0.2s
        }

        .nav-chevron.open {
            transform: rotate(180deg)
        }

        .sub-nav {
            padding-left: 18px
        }

        .sub-item {
            width: 100%;
            text-align: left;
            padding: 5px 18px 5px 32px;
            color: var(--text-muted);
            font-size: 12.5px;
            background: transparent;
            border-left: 1px solid var(--border-light);
            display: block;
            transition: color 0.1s
        }

        .sub-item:hover {
            color: var(--text-primary)
        }

        .user-bar {
            padding: 12px 18px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--bg-active);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-secondary);
            flex-shrink: 0
        }

        /* Header */
        .breadcrumb {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .bc-item {
            font-size: 13px;
            color: var(--text-muted)
        }

        .bc-item.last {
            color: var(--text-primary);
            font-weight: 500
        }

        .bc-sep {
            color: var(--text-muted);
            font-size: 12px
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            padding: 6px 12px;
            width: 200px
        }

        .search-box input {
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 13px;
            width: 100%
        }

        .kbd {
            font-size: 10px;
            color: var(--text-muted);
            background: var(--bg-active);
            border: 1px solid var(--border);
            padding: 1px 5px;
            border-radius: 3px;
            font-family: var(--mono)
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            color: var(--text-secondary);
            font-size: 14px;
            position: relative
        }

        .notif-dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent)
        }

        .date-chip {
            font-size: 11.5px;
            color: var(--text-muted);
            font-family: var(--mono);
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            padding: 6px 10px
        }

        /* Cards */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            overflow: hidden
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border)
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary)
        }

        .card-body {
            padding: 20px
        }

        .card-body.no-pad {
            padding: 0
        }

        /* Stat cards */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px
        }

        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            padding: 18px 20px
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px
        }

        .stat-value {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -1px
        }

        .stat-sub {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px
        }

        .trend {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 20px
        }

        .trend.up {
            color: var(--green);
            background: var(--green-dim)
        }

        .trend.down {
            color: var(--red);
            background: var(--red-dim)
        }

        /* Table */
        .tbl-wrap {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        thead tr {
            border-bottom: 1px solid var(--border)
        }

        th {
            padding: 10px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap
        }

        th.r {
            text-align: right
        }

        th.c {
            text-align: center
        }

        tbody tr {
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: background 0.1s
        }

        tbody tr:hover {
            background: var(--bg-hover)
        }

        td {
            padding: 11px 16px;
            font-size: 13px;
            color: var(--text-primary)
        }

        td.r {
            text-align: right
        }

        td.c {
            text-align: center
        }

        /* Badges */
        .badge {
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-block
        }

        .badge-default {
            background: var(--bg-active);
            color: var(--text-secondary)
        }

        .badge-success {
            background: var(--green-dim);
            color: var(--green)
        }

        .badge-warning {
            background: var(--amber-dim);
            color: var(--amber)
        }

        .badge-danger {
            background: var(--red-dim);
            color: var(--red)
        }

        .badge-info {
            background: var(--accent-dim);
            color: var(--accent)
        }

        /* Buttons */
        .btn {
            border-radius: var(--r-sm);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: opacity 0.1s;
            font-family: var(--sans)
        }

        .btn:hover {
            opacity: 0.85
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: 1px solid var(--accent);
            padding: 7px 16px;
            font-size: 13px
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 7px 16px;
            font-size: 13px
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid transparent;
            padding: 7px 12px;
            font-size: 13px
        }

        .btn-sm {
            padding: 5px 12px !important;
            font-size: 12px !important
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 2px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px
        }

        .tab {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 400;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            background: none;
            cursor: pointer;
            transition: all 0.1s
        }

        .tab.active {
            color: var(--text-primary);
            font-weight: 500;
            border-bottom-color: var(--accent)
        }

        /* Page header */
        .page-hdr {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 24px
        }

        .page-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px
        }

        .page-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 3px
        }

        .page-actions {
            display: flex;
            gap: 8px;
            align-items: center
        }

        /* Form */
        .form-grid {
            display: grid;
            gap: 16px;
            margin-bottom: 24px
        }

        .form-grid-3 {
            grid-template-columns: 1fr 1fr 1fr
        }

        .form-grid-2 {
            grid-template-columns: 1fr 1fr
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px
        }

        .field label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary)
        }

        .field .req {
            color: var(--red);
            margin-left: 3px
        }

        .inp {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            width: 100%;
            transition: border-color 0.1s
        }

        .inp:focus {
            border-color: var(--accent)
        }

        select.inp {
            cursor: pointer
        }

        /* Items table in form */
        .items-head {
            display: grid;
            gap: 8px;
            margin-bottom: 6px
        }

        .items-row {
            display: grid;
            gap: 8px;
            margin-bottom: 6px
        }

        /* Misc */
        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px
        }

        .row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px
        }

        .mini-bar {
            height: 4px;
            background: var(--bg-active);
            border-radius: 2px;
            overflow: hidden;
            flex: 1
        }

        .mini-bar-fill {
            height: 100%;
            border-radius: 2px
        }

        .alert-item {
            display: flex;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--r-sm);
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            margin-bottom: 8px
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 5px
        }

        .empty {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-muted);
            font-size: 13px
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px
        }

        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 16px 0
        }

        .text-right {
            text-align: right
        }

        .text-center {
            text-align: center
        }

        .mono {
            font-family: var(--mono)
        }

        .text-muted {
            color: var(--text-muted)
        }

        .text-green {
            color: var(--green)
        }

        .text-red {
            color: var(--red)
        }

        .flex {
            display: flex
        }

        .flex-1 {
            flex: 1
        }

        .gap-8 {
            gap: 8px
        }

        .gap-12 {
            gap: 12px
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- SIDEBAR -->
        <aside id="sidebar">
            <div class="logo">
                <div class="logo-icon">M</div>
                <div>
                    <div class="logo-name">TechMicra</div>
                    <div class="logo-ver">ERP v1.0</div>
                </div>
            </div>
            <nav id="nav"></nav>
            <div class="user-bar">
                <div class="avatar">A</div>
                <div style="flex:1">
                    <div style="font-size:12.5px;font-weight:500">Admin</div>
                    <div style="font-size:11px;color:var(--text-muted)">Super Admin</div>
                </div>
                <button style="color:var(--text-muted);font-size:14px">⊙</button>
            </div>
        </aside>

        <!-- MAIN -->
        <div id="main">
            <header id="header">
                <div class="breadcrumb" id="breadcrumb"></div>
                <div style="display:flex;align-items:center;gap:8px">
                    <div class="search-box">
                        <span style="font-size:12px;color:var(--text-muted)">⌕</span>
                        <input placeholder="Search..." />
                        <span class="kbd">⌘K</span>
                    </div>
                    <div class="icon-btn"><span>⚬</span><span class="notif-dot"></span></div>
                    <div class="date-chip" id="date-chip"></div>
                </div>
            </header>
            <main id="content"></main>
        </div>
    </div>

    <script>
        // ─── NAV DATA ────────────────────────────────────────────
        const NAV = [
            {
                group: "Operations", items: [
                    { id: "dashboard", label: "Dashboard", icon: "⬡" },
                    { id: "sales", label: "Sales", icon: "◈", sub: ["Inquiry", "Quotation", "Sale Order", "Invoice", "Collections"] },
                    { id: "purchase", label: "Purchase", icon: "◉", sub: ["Indent", "PO", "GRN", "IQC", "Bill Book"] },
                    { id: "production", label: "Production", icon: "◫", sub: ["BOM", "Route Card", "Material Issue", "Job Order", "Reports"] },
                    { id: "logistics", label: "Logistics", icon: "◧", sub: ["Transport Master", "Orders", "Challan Out", "Freight Bills"] },
                ]
            },
            {
                group: "Management", items: [
                    { id: "quality", label: "Quality", icon: "◎", sub: ["IQC", "PQC", "PDI", "QRD"] },
                    { id: "stores", label: "Stores", icon: "▣", sub: ["Warehouse", "Stock Transfer", "SRV"] },
                    { id: "maintenance", label: "Maintenance", icon: "◌", sub: ["Tool Master", "Calibration", "Repair Logs"] },
                    { id: "assets", label: "Assets", icon: "◆", sub: ["Asset Master", "Allocation", "Depreciation"] },
                ]
            },
            {
                group: "Finance & HR", items: [
                    { id: "finance", label: "Finance", icon: "◑", sub: ["Vouchers", "Bank Recon", "Credit Cards"] },
                    { id: "hr", label: "HR", icon: "◐", sub: ["Employees", "Salary", "Advances"] },
                    { id: "contractors", label: "Contractors", icon: "◒", sub: ["Workers", "Salary Sheet", "Payments"] },
                    { id: "statutory", label: "Statutory", icon: "◓", sub: ["GST", "TDS/TCS", "Balance Sheet"] },
                ]
            },
            {
                group: "Intelligence", items: [
                    { id: "simulation", label: "Simulation", icon: "◈" },
                ]
            },
        ];

        const BREADCRUMBS = {
            dashboard: ["Dashboard"],
            sales: ["Sales", "Management"],
            purchase: ["Purchase", "Management"],
            production: ["Production", "Management"],
            finance: ["Finance", "Management"],
            hr: ["HR", "Management"],
            quality: ["Quality", "Management"],
            simulation: ["Intelligence", "Simulation"],
            logistics: ["Logistics", "Management"],
            stores: ["Stores", "Warehouse"],
            maintenance: ["Maintenance", "Management"],
            assets: ["Assets", "Management"],
            statutory: ["Statutory", "Compliance"],
            contractors: ["Contractors", "Management"],
        };

        let activePage = "dashboard";
        const expanded = { sales: true };

        // ─── HELPERS ─────────────────────────────────────────────
        const h = (tag, attrs = {}, ...children) => {
            const el = document.createElement(tag);
            Object.entries(attrs).forEach(([k, v]) => {
                if (k === "class") el.className = v;
                else if (k === "style") el.style.cssText = v;
                else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
                else el.setAttribute(k, v);
            });
            children.flat(Infinity).forEach(c => {
                if (c == null) return;
                el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
            });
            return el;
        };

        const badge = (label, type = "default") => h("span", { class: `badge badge-${type}` }, label);
        const btn = (label, cls = "btn-primary", onclick = null, icon = "") =>
            h("button", { class: `btn ${cls}`, onclick }, icon ? h("span", {}, icon) : "", label);

        const card = (title, content, actionEl = null, noPad = false) => {
            const c = h("div", { class: "card" });
            if (title || actionEl) {
                const hd = h("div", { class: "card-header" },
                    h("span", { class: "card-title" }, title));
                if (actionEl) hd.appendChild(actionEl);
                c.appendChild(hd);
            }
            const body = h("div", { class: `card-body${noPad ? " no-pad" : ""}` });
            if (typeof content === "string") body.innerHTML = content;
            else if (content instanceof Node) body.appendChild(content);
            else if (Array.isArray(content)) content.forEach(n => n && body.appendChild(n));
            c.appendChild(body);
            return c;
        };

        const table = (cols, rows, onRow = null) => {
            const wrap = h("div", { class: "tbl-wrap" });
            const tbl = h("table");
            const thead = h("thead");
            const tr = h("tr");
            cols.forEach(col => tr.appendChild(h("th", { class: col.align || "" }, col.label)));
            thead.appendChild(tr); tbl.appendChild(thead);
            const tbody = h("tbody");
            if (!rows.length) {
                const td = h("td", { colspan: cols.length, class: "c" }, h("div", { class: "empty" }, "No records found"));
                tbody.appendChild(h("tr", {}, td));
            }
            rows.forEach(row => {
                const tr = h("tr", {});
                if (onRow) tr.addEventListener("click", () => onRow(row));
                cols.forEach(col => {
                    const td = h("td", { class: col.align || "" });
                    if (col.render) td.appendChild(col.render(row[col.key], row));
                    else td.textContent = row[col.key] ?? "-";

                        { no: "RC-2024-439", batch: "B-439", product: "Baleno Panel", plan: 200, done: 120, start: "30 May", end: "06 Jun", status: "On Hold" },
                    ];
                    const STATUS_TYPES = { "In Progress": "info", "Closed": "success", "On Hold": "warning" };
                    contentArea.appendChild(card("Route Cards", table([
                        { key: "no", label: "Route Card No" }, { key: "batch", label: "Batch No" },
                        { key: "product", label: "Product" }, { key: "plan", label: "Plan Qty", align: "c" },
                        { key: "done", label: "Done Qty", align: "c" }, { key: "start", label: "Start" },
                        { key: "end", label: "End" }, { key: "status", label: "Status", align: "c", render: v => badge(v, STATUS_TYPES[v]) },
                    ], rows), btn("+ New Route Card", "btn btn-primary btn-sm"), true));
                } else if (activeTab === "BOM") {
                    const rows = [
                        { fg: "Alto Bracket", process: "Cutting", machine: "CNC-01", rawMat: "MS Sheet 2mm", output: 50 },
                        { fg: "Alto Bracket", process: "Bending", machine: "Bend-02", rawMat: "Cut Pieces", output: 50 },
                        { fg: "Swift Frame", process: "Welding", machine: "Weld-01", rawMat: "MS Pipe 40mm", output: 25 },
                    ];
                    contentArea.appendChild(card("Bill of Materials", table([
                        { key: "fg", label: "Finished Good" }, { key: "process", label: "Process" },
                        { key: "machine", label: "Machine" }, { key: "rawMat", label: "Raw Material" },
                        { key: "output", label: "Output Qty", align: "c" },
                    ], rows), btn("+ Add BOM", "btn btn-primary btn-sm"), true));
                } else if (activeTab === "Reports") {
                    const rows = [
                        { date: "05 Jun", shift: "A", machine: "CNC-01", operator: "Ramesh K.", prodQty: 180, rejQty: 4 },
                        { date: "05 Jun", shift: "A", machine: "Weld-01", operator: "Suresh P.", prodQty: 120, rejQty: 2 },
                        { date: "05 Jun", shift: "B", machine: "CNC-01", operator: "Dinesh L.", prodQty: 160, rejQty: 8 },
                    ];
                    contentArea.appendChild(card("Daily Production Report", table([
                        { key: "date", label: "Date" }, { key: "shift", label: "Shift", align: "c" },
                        { key: "machine", label: "Machine" }, { key: "operator", label: "Operator" },
                        { key: "prodQty", label: "Prod Qty", align: "c" },
                        {
                            key: "rejQty", label: "Rejection", align: "c", render: v => {
                                const s = h("span", { style: `color:${v > 5 ? "var(--red)" : "var(--text-primary)"}` }, String(v)); return s;
                            }
                        },
                    ], rows), btn("+ Add Entry", "btn btn-primary btn-sm"), true));
                } else {
                    contentArea.appendChild(card(activeTab, h("div", { class: "empty" }, `${activeTab} content coming soon`)));
                }
            };
            TABS.forEach(t => {
                const tb = h("button", {
                    class: `tab${t === activeTab ? " active" : ""}`, onclick: () => {
                        activeTab = t; tabRow.querySelectorAll(".tab").forEach((el, i) => el.classList.toggle("active", TABS[i] === t)); renderTabContent();
                    }
                }, t);
                tabRow.appendChild(tb);
            });
            frag.appendChild(tabRow); renderTabContent(); frag.appendChild(contentArea);
            return frag;
        }

        // SIMULATION
        function renderSimulation() {
            const frag = document.createDocumentFragment();
            frag.appendChild(pageHdr("Production Simulation", "MPS → Material Requirements + Capacity + Cost Estimation"));
            let simItems = [{ product: "Alto", qty: 20 }, { product: "Swift", qty: 30 }, { product: "Baleno", qty: 25 }];
            let shiftHours = 10, workers = 50, calculated = false;
            const wrap = h("div", { style: "display:grid;grid-template-columns:1fr 1fr;gap:16px" });

            const inputCard = h("div", { class: "card" });
            const inputBody = h("div", { class: "card-body" });
            inputCard.appendChild(h("div", { class: "card-header" }, h("span", { class: "card-title" }, "Master Production Schedule (MPS)")));
            inputCard.appendChild(inputBody);

            const resultsArea = h("div", { style: "display:flex;flex-direction:column;gap:12px" });

            const redrawInput = () => {
                inputBody.innerHTML = "";
                const hdr = h("div", { style: "display:grid;grid-template-columns:1fr 100px 32px;gap:8px;margin-bottom:8px" });
                ["Product", "Target Qty", ""].forEach(l => hdr.appendChild(h("div", { style: "font-size:11px;color:var(--text-muted)" }, l)));
                inputBody.appendChild(hdr);
                simItems.forEach((_, i) => {
                    const row = h("div", { style: "display:grid;grid-template-columns:1fr 100px 32px;gap:8px;margin-bottom:6px" });
                    const pi = inp(simItems[i].product);
                    pi.value = simItems[i].product;
                    pi.oninput = e => { simItems[i].product = e.target.value };
                    const qi = inp("0", "number");
                    qi.value = simItems[i].qty;
                    qi.oninput = e => { simItems[i].qty = Number(e.target.value) };
                    row.appendChild(pi); row.appendChild(qi);
                    row.appendChild(h("button", { style: "color:var(--text-muted);font-size:16px", onclick: () => { simItems.splice(i, 1); redrawInput() } }, "×"));
                    inputBody.appendChild(row);
                });
                inputBody.appendChild(btn("+ Add Product", "btn-ghost", () => { simItems.push({ product: "", qty: 0 }); redrawInput() }));
                inputBody.appendChild(h("hr", { style: "border:none;border-top:1px solid var(--border);margin:16px 0" }));
                const paramGrid = h("div", { style: "display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px" });
                const shi = inp("10", "number"); shi.value = shiftHours; shi.oninput = e => { shiftHours = Number(e.target.value) };
                const wi = inp("50", "number"); wi.value = workers; wi.oninput = e => { workers = Number(e.target.value) };
                paramGrid.appendChild(field("Shift Hours", shi));
                paramGrid.appendChild(field("Number of Workers", wi));
                inputBody.appendChild(paramGrid);
                inputBody.appendChild(btn("▶ Run Simulation", "btn-primary", () => {
                    calculated = true; redrawResults();
                }));
            };

            const redrawResults = () => {
                resultsArea.innerHTML = "";
                if (!calculated) {
                    const ph = h("div", { class: "card" });
                    const pb = h("div", { class: "card-body", style: "text-align:center;padding:60px 0" });
                    pb.appendChild(h("div", { style: "font-size:32px;margin-bottom:12px;opacity:0.3" }, "◈"));
                    pb.appendChild(h("div", { style: "color:var(--text-muted);font-size:13px" }, "Configure the MPS and click Run Simulation"));
                    ph.appendChild(pb); resultsArea.appendChild(ph); return;
                }
                const totalUnits = simItems.reduce((s, i) => s + Number(i.qty), 0);
                const manHoursPerUnit = 4.5, laborRate = 250, energyRate = 85, matPerUnit = 18500;
                const totalManHours = totalUnits * manHoursPerUnit;
                const daysRequired = Math.ceil(totalManHours / (workers * shiftHours));
                const laborCost = totalManHours * laborRate;
                const overhead = totalManHours * energyRate;
                const materialCost = totalUnits * matPerUnit;
                const totalCost = laborCost + materialCost + overhead;
                const sg = h("div", { style: "display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px" });
                [
                    ["Days Required", `${daysRequired} days`],
                    ["Total Man-Hours", totalManHours.toLocaleString()],
                    ["Total Est. Cost", `₹${(totalCost / 100000).toFixed(1)}L`],
                    ["Material Ready", "74%"],
                ].forEach(([l, v]) => sg.appendChild(statCard(l, v, undefined, "")));
                resultsArea.appendChild(sg);
                const costRows = [
                    { head: "Material Cost", amount: `₹${(materialCost / 100000).toFixed(2)}L`, pct: `${((materialCost / totalCost) * 100).toFixed(1)}%` },
                    { head: "Labor Cost", amount: `₹${(laborCost / 100000).toFixed(2)}L`, pct: `${((laborCost / totalCost) * 100).toFixed(1)}%` },
                    { head: "Overhead (Electricity)", amount: `₹${(overhead / 100000).toFixed(2)}L`, pct: `${((overhead / totalCost) * 100).toFixed(1)}%` },
                ];
                resultsArea.appendChild(card("Cost Breakdown", table([
                    { key: "head", label: "Cost Head" }, { key: "amount", label: "Amount", align: "r" }, { key: "pct", label: "%", align: "r" },
                ], costRows), null, true));
            };

            redrawInput(); redrawResults();
            wrap.appendChild(inputCard); wrap.appendChild(resultsArea);
            frag.appendChild(wrap);
            return frag;
        }

        // GENERIC
        function renderGeneric(title, desc) {
            const frag = document.createDocumentFragment();
            frag.appendChild(pageHdr(title, desc));
            const c = h("div", { class: "card" });
            const b = h("div", { class: "card-body", style: "text-align:center;padding:60px 0" });
            b.appendChild(h("div", { style: "font-size:32px;margin-bottom:12px;opacity:0.3" }, "◉"));
            b.appendChild(h("div", { style: "color:var(--text-muted);font-size:13px" }, `${title} module is ready for development`));
            c.appendChild(b); frag.appendChild(c);
            return frag;
        }

        function renderContent() {
            const content = document.getElementById("content");
            content.innerHTML = "";
            const id = activePage.split("/")[0];
            let frag;
            if (id === "dashboard") frag = renderDashboard();
            else if (id === "sales") frag = renderSales();
            else if (id === "purchase") frag = renderPurchase();
            else if (id === "production") frag = renderProduction();
            else if (id === "simulation") frag = renderSimulation();
            else {
                const titles = {
                    finance: "Finance Management", hr: "HR Management", quality: "Quality Management",
                    logistics: "Logistics Management", stores: "Stores & Warehouse",
                    maintenance: "Maintenance Management", assets: "Asset Management",
                    statutory: "Statutory & Compliance", contractors: "Contractor Management",
                };
                const descs = {
                    finance: "Vouchers, reconciliation & financial statements",
                    hr: "Employee records, payroll & advances",
                    quality: "IQC → PQC → PDI — end-to-end quality control",
                    logistics: "Transport orders, challan and freight bills",
                    stores: "Stock movement, transfers and receipts",
                    maintenance: "Tool master, calibration and repair logs",
                    assets: "Asset register, allocation and depreciation",
                    statutory: "GST, TDS/TCS and balance sheet",
                    contractors: "Contract labor, attendance and payouts",
                };
                frag = renderGeneric(titles[id] || id, descs[id] || "");
            }
            content.appendChild(frag);
        }

        // ─── INIT ─────────────────────────────────────────────────
        renderSidebar();
        renderBreadcrumb();
        renderContent();
    </script>
</body>

</html>
