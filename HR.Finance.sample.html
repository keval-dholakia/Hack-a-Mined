<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechMicra ERP — HR & Finance Modules</title>
    <style>
        :root {
            --bg-base: #0d0d0f;
            --bg-surface: #141417;
            --bg-elevated: #1c1c21;
            --bg-active: #26262e;
            --bg-hover: #1f1f26;
            --border: #2a2a35;
            --border-light: #1f1f28;
            --text-primary: #f0f0f4;
            --text-secondary: #a0a0b8;
            --text-muted: #606078;
            --accent: #4f6ef7;
            --accent-dim: #1e2a5a;
            --green: #3ddc84;
            --green-dim: #0f2e1e;
            --amber: #f5a623;
            --amber-dim: #2e200a;
            --red: #f04438;
            --red-dim: #2e100e;
            --radius-sm: 6px;
            --radius-md: 10px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 14px;
            height: 100%;
        }

        button {
            background: none;
            border: none;
            color: inherit;
            font-family: inherit;
            cursor: pointer;
        }

        input,
        select {
            font-family: inherit;
            color: var(--text-primary);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .layout {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-brand {
            padding: 20px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-brand .logo {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: #fff;
        }

        .sidebar-brand span {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: -.3px;
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
        }

        .nav-section {
            padding: 6px 14px 4px;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            font-size: 12.5px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all .1s;
            border-radius: 6px;
            margin: 1px 6px;
        }

        .nav-item:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--accent-dim);
            color: var(--accent);
            font-weight: 500;
        }

        .nav-icon {
            font-size: 14px;
            width: 20px;
            text-align: center;
        }

        /* Main */
        .main {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 52px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
            flex-shrink: 0;
        }

        .topbar-breadcrumb {
            font-size: 12px;
            color: var(--text-muted);
        }

        .topbar-breadcrumb .current {
            color: var(--text-primary);
            font-weight: 500;
        }

        .content {
            flex: 1;
            padding: 24px;
        }

        /* Cards */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: 12px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
        }

        .card-body {
            padding: 20px;
        }

        .card-body.no-pad {
            padding: 0;
        }

        /* Page header */
        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -.5px;
        }

        .page-header .desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 2px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all .1s;
            color: var(--text-muted);
            font-family: inherit;
        }

        .tab-btn.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent);
            font-weight: 500;
        }

        /* Stat cards */
        .stat-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 12px;
        }

        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 18px 20px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -1px;
        }

        .stat-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .trend-badge {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 20px;
            margin-right: 6px;
        }

        .trend-pos {
            background: var(--green-dim);
            color: var(--green);
        }

        .trend-neg {
            background: var(--red-dim);
            color: var(--red);
        }

        /* Table */
        .tbl {
            width: 100%;
            border-collapse: collapse;
        }

        .tbl th {
            padding: 10px 16px;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: .06em;
            text-transform: uppercase;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .tbl th.r,
        .tbl td.r {
            text-align: right;
        }

        .tbl th.c,
        .tbl td.c {
            text-align: center;
        }

        .tbl td {
            padding: 11px 16px;
            font-size: 13px;
            border-bottom: 1px solid var(--border-light);
        }

        .tbl tbody tr {
            transition: background .1s;
        }

        .tbl tbody tr:hover {
            background: var(--bg-hover);
        }

        .tbl tfoot tr {
            background: var(--bg-elevated);
        }

        .tbl tfoot td {
            padding: 10px 16px;
            font-size: 13px;
            border-top: 1px solid var(--border);
        }

        .tbl-wrap {
            overflow-x: auto;
        }

        .no-rows {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Badges */
        .badge {
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .badge-success {
            background: var(--green-dim);
            color: var(--green);
        }

        .badge-warning {
            background: var(--amber-dim);
            color: var(--amber);
        }

        .badge-danger {
            background: var(--red-dim);
            color: var(--red);
        }

        .badge-info {
            background: var(--accent-dim);
            color: var(--accent);
        }

        .badge-default {
            background: var(--bg-active);
            color: var(--text-secondary);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            font-size: 13px;
            font-weight: 500;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: opacity .1s;
            font-family: inherit;
        }

        .btn:hover {
            opacity: .85;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: 1px solid var(--accent);
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid transparent;
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
        }

        /* Forms */
        .form-grid {
            display: grid;
            gap: 16px;
            margin-bottom: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .field .hint {
            font-size: 11px;
            color: var(--text-muted);
        }

        .inp,
        .sel {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            width: 100%;
            transition: border-color .1s;
            font-family: inherit;
        }

        .inp:focus,
        .sel:focus {
            border-color: var(--accent);
        }

        .form-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        /* Misc */
        .mono {
            font-family: var(--font-mono);
        }

        .muted {
            color: var(--text-muted);
        }

        .green {
            color: var(--green);
        }

        .red {
            color: var(--red);
        }

        .accent {
            color: var(--accent);
        }

        .amber {
            color: var(--amber);
        }

        .fw500 {
            font-weight: 500;
        }

        .fw600 {
            font-weight: 600;
        }

        .fw700 {
            font-weight: 700;
        }

        .fs12 {
            font-size: 12px;
        }

        .fs11 {
            font-size: 11px;
        }

        /* Grid helpers */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        /* Balance bar highlight */
        .balance-card {
            padding: 18px 20px;
            border-radius: var(--radius-md);
            background: var(--bg-surface);
            border: 1px solid var(--border);
        }

        .toggle-type {
            padding: 6px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all .1s;
            font-family: inherit;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            background: var(--bg-elevated);
        }

        .toggle-type.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* Progress bar */
        .hbar-wrap {
            margin-bottom: 10px;
        }

        .hbar-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .hbar-track {
            height: 5px;
            background: var(--bg-active);
            border-radius: 3px;
            overflow: hidden;
        }

        .hbar-fill {
            height: 100%;
            border-radius: 3px;
        }
    </style>
</head>

                { key: 'no', label: 'Voucher No', render: v => `<span class="mono fs12">${v}</span>` },
                { key: 'date', label: 'Date' },
                { key: 'ledger', label: 'GST Ledger', render: v => `<span class="fw500">${v}</span>` },
                {
                    key: 'adjType', label: 'Adjustment',
                    render: v => badge(v, v === 'Reversal' ? 'danger' : v === 'Claim' ? 'success' : v === 'Adjustment' ? 'warning' : 'default')
                },
                { key: 'amount', label: 'Amount', align: 'r', render: v => `<span class="mono fw500">${fmtC(v)}</span>` },
                { key: 'remark', label: 'Remark', render: v => `<span class="fs12 muted">${v}</span>` },
            ], GST_VOUCHERS)}
      </div>
    </div>`;
        }

        function finRecon() {
            const bankBal = 2842500, bookBal = 2814300, diff = 28200;
            const statusMap = { Matched: 'success', 'In Transit': 'warning', Unrecorded: 'info' };
            return `
    <div class="card card-body" style="margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        <div><div style="font-size:11px;color:var(--text-muted);margin-bottom:3px">Bank Account</div>
          <div style="font-size:13px;font-weight:500">HDFC Current A/c — ···4521</div></div>
        <div><div style="font-size:11px;color:var(--text-muted);margin-bottom:3px">Statement Date</div>
          <div style="font-size:13px;font-family:var(--font-mono)">05 Jun 2024</div></div>
        <div style="margin-left:auto;display:flex;gap:8px">
          ${btn('Change Account', 'secondary', 'sm')}
          ${btn('Mark Reconciled', 'primary', 'sm')}
        </div>
      </div>
    </div>
    <div class="grid-3" style="margin-bottom:12px">
      <div style="background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);
        padding:18px 20px;border-left:3px solid var(--green)">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">BANK BALANCE (Statement)</div>
        <div style="font-size:24px;font-weight:700;font-family:var(--font-mono);color:var(--green)">${fmtC(bankBal)}</div>
      </div>
      <div style="background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);
        padding:18px 20px;border-left:3px solid var(--accent)">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">BOOK BALANCE (System)</div>
        <div style="font-size:24px;font-weight:700;font-family:var(--font-mono);color:var(--accent)">${fmtC(bookBal)}</div>
      </div>
      <div style="background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);
        padding:18px 20px;border-left:3px solid var(--amber)">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">UNRECONCILED DIFFERENCE</div>
        <div style="font-size:24px;font-weight:700;font-family:var(--font-mono);color:var(--amber)">${fmtC(diff)}</div>
        <div style="font-size:11px;color:var(--amber);margin-top:4px">Requires attention</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Transaction Matching</span></div>
      <div class="card-body no-pad">
        ${tableEl([
                { key: 'date', label: 'Date' },
                { key: 'desc', label: 'Description', render: v => `<span class="fw500">${v}</span>` },
                {
                    key: 'bankAmt', label: 'Bank Amount', align: 'r',
                    render: v => v != null ? `<span class="mono" style="color:${v >= 0 ? 'var(--green)' : 'var(--red)'}">${v >= 0 ? '+' : ''}${fmtC(v)}</span>` : '<span class="muted">—</span>'
                },
                {
                    key: 'bookAmt', label: 'Book Amount', align: 'r',
                    render: v => v != null ? `<span class="mono" style="color:${v >= 0 ? 'var(--green)' : 'var(--red)'}">${v >= 0 ? '+' : ''}${fmtC(v)}</span>` : '<span class="muted">—</span>'
                },
                {
                    key: 'status', label: 'Status', align: 'c',
                    render: v => badge(v, statusMap[v] || 'default')
                },
            ], BANK_RECON_ITEMS)}
      </div>
    </div>`;
        }

        function finCards() {
            const total = CREDIT_CARDS.reduce((s, c) => s + c.amount, 0);
            const byHead = {};
            CREDIT_CARDS.forEach(c => byHead[c.head] = (byHead[c.head] || 0) + c.amount);
            const maxH = Math.max(...Object.values(byHead));
            const colors = ["var(--accent)", "var(--green)", "var(--amber)", "var(--red)", "var(--text-muted)"];
            return `
    <div class="grid-2">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Credit Card Transactions — May 2024</span>
          ${btn('+ Add Transaction', 'primary', 'sm')}
        </div>
        <div class="card-body no-pad">
          ${tableEl([
                { key: 'card', label: 'Card', render: v => `<span class="mono fs11">${v}</span>` },
                { key: 'date', label: 'Date' },
                { key: 'merchant', label: 'Merchant', render: v => `<span class="fw500">${v}</span>` },
                { key: 'head', label: 'Category', render: v => badge(v, 'default') },
                { key: 'amount', label: 'Amount', align: 'r', render: v => `<span class="mono fw500 red">−${fmtC(v)}</span>` },
            ], CREDIT_CARDS)}
          <div style="display:flex;justify-content:space-between;padding:12px 16px;
            border-top:1px solid var(--border);background:var(--bg-elevated)">
            <span style="font-size:13px;font-weight:600">Total Spend</span>
            <span style="font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--red)">−${fmtC(total)}</span>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Spend by Category</span></div>
        <div class="card-body">
          ${Object.entries(byHead).sort(([, a], [, b]) => b - a).map(([head, val], i) =>
                hbar(head, val, maxH, colors[i % colors.length], fmtC(val))
            ).join('')}
          <div style="border-top:1px solid var(--border);padding-top:10px;margin-top:4px;
            display:flex;justify-content:space-between">
            <span style="font-size:12px;font-weight:600">Total</span>
            <span style="font-size:13px;font-weight:700;font-family:var(--font-mono);color:var(--red)">${fmtC(total)}</span>
          </div>
        </div>
      </div>
    </div>`;
        }

        // ─── NAVIGATION ───────────────────────────────────────────
        let currentModule = 'hr';

        function switchModule(mod) {
            currentModule = mod;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${mod}`)?.classList.add('active');
            if (mod === 'hr') { renderHR(); return; }
            if (mod === 'finance') { renderFinance(); return; }
            // placeholder for other modules
            const names = {
                dashboard: 'Dashboard', sales: 'Sales', purchase: 'Purchase', production: 'Production',
                quality: 'Quality', logistics: 'Logistics', stores: 'Stores', maintenance: 'Maintenance',
                simulation: 'Simulation', statutory: 'Statutory', assets: 'Assets',
            };
            document.getElementById('breadcrumb').innerHTML =
                `TechMicra ERP &rsaquo; <span class="current">${names[mod] || mod}</span>`;
            document.getElementById('content').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;height:60vh;
      flex-direction:column;gap:12px;color:var(--text-muted)">
      <div style="font-size:40px">🔧</div>
      <div style="font-size:16px;font-weight:500">${names[mod] || mod} Module</div>
      <div style="font-size:13px">This module is available in the full React build</div>
    </div>`;
        }

        // ─── INIT ─────────────────────────────────────────────────
        renderHR();

        // fix tab click for Finance (& escaping)
        document.addEventListener('click', function (e) {
            const t = e.target;
            if (t.classList.contains('tab-btn') && t.textContent === 'Payment & Receipt') {
                finTab = 'Payment & Receipt';
                renderFinance();
            }
        });
    </script>
</body>

</html>
